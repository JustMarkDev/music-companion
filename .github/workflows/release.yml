name: Release

# Releases are cut by semantic-release from conventional commits on main. Called by ci.yml
# after the CI gate passes: release (tag + draft release) -> build -> publish.

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and draft release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      # Bumps tauri.conf.json, Cargo.toml and Cargo.lock, commits, tags, and creates a draft release.
      # --force: package.json pins bun through devEngines, so npm/npx aborts
      # with EBADDEVENGINES without it (only way to skip the check per npm/rfcs#830).
      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --force -y -p semantic-release@25.0.9 -p @semantic-release/exec@7.1.0 -p @semantic-release/git@11.0.1 semantic-release

  release-windows:
    name: Build and publish Windows installers
    runs-on: windows-latest
    needs: release
    if: needs.release.outputs.version != ''
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Uploads to the draft release created above; the publish job releases it.
      - name: Build and upload installers
        uses: tauri-apps/tauri-action@a6e90ddc4ba4721f294e52b856d3d50e645edc07 # dev branch head; pinned so the signing key never meets a moving ref
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v${{ needs.release.outputs.version }}
          releaseDraft: true
          args: --target x86_64-pc-windows-msvc

  release-macos:
    name: Build and publish macOS disk image
    runs-on: macos-latest
    # The Windows job owns the release body and the updater manifest, so it has to
    # create the release first.
    needs: [release, release-windows]
    if: needs.release.outputs.version != ''
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Verify CMake is available
        run: cmake --version || brew install cmake

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # GitHub expands missing secrets to empty strings. tauri-cli treats a present
      # APPLE_CERTIFICATE env var as "sign this build" and then fails on
      # `security import` with a blank payload. Only forward non-empty values so
      # unsigned DMGs still publish; adding real secrets enables signing with no
      # other workflow change.
      - name: Configure optional Apple signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for key in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID
          do
            val="${!key}"
            if [ -n "$val" ]; then
              {
                echo "${key}<<EOF"
                printf '%s\n' "$val"
                echo "EOF"
              } >> "$GITHUB_ENV"
            fi
          done

      - name: Build and upload disk image
        uses: tauri-apps/tauri-action@a6e90ddc4ba4721f294e52b856d3d50e645edc07 # dev branch head; pinned so the signing key never meets a moving ref
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v${{ needs.release.outputs.version }}
          releaseDraft: true
          # Merges the macOS entry into the Windows updater manifest. Updates are
          # verified by the Tauri minisign key, so Apple signing is not required.
          args: --target universal-apple-darwin

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [release, release-macos]
    if: needs.release.outputs.version != ''
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ needs.release.outputs.version }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
