name: Release

# Releases are cut by semantic-release from conventional commits on main.
# plan (dry run) -> verify -> release (tag + draft release) -> build -> publish.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Dry run: writes `version=` to the step output only when a release is due.
      - name: Compute next version
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx -y -p semantic-release@25 -p @semantic-release/exec@7 -p @semantic-release/git@11 semantic-release --dry-run

  verify:
    name: Verify commit (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            targets: x86_64-pc-windows-msvc
          - name: macOS
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
          components: rustfmt, clippy

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      # build.rs compiles the vendored MediaRemote adapter with CMake.
      - name: Verify CMake is available
        if: runner.os == 'macOS'
        run: cmake --version || brew install cmake

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check frontend
        run: bun run check

      - name: Lint frontend
        run: bun run lint

      - name: Check frontend formatting
        run: bun run format:check

      - name: Build frontend
        run: bun run build

      - name: Audit frontend dependencies
        run: bun audit

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Test Rust documentation
        run: cargo test --manifest-path src-tauri/Cargo.toml --doc

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: cargo audit

  release:
    name: Tag and draft release
    runs-on: ubuntu-latest
    needs: [plan, verify]
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Bumps tauri.conf.json, Cargo.toml and Cargo.lock, commits, tags, and creates a draft release.
      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx -y -p semantic-release@25 -p @semantic-release/exec@7 -p @semantic-release/git@11 semantic-release

  release-windows:
    name: Build and publish Windows installers
    runs-on: windows-latest
    needs: release
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Uploads to the draft release created above; the publish job releases it.
      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v${{ needs.release.outputs.version }}
          releaseDraft: true
          args: --target x86_64-pc-windows-msvc

  release-macos:
    name: Build and publish macOS disk image
    runs-on: macos-latest
    # The Windows job owns the release body and the updater manifest, so it has to
    # create the release first.
    needs: [release, release-windows]
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Verify CMake is available
        run: cmake --version || brew install cmake

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # GitHub expands missing secrets to empty strings. tauri-cli treats a present
      # APPLE_CERTIFICATE env var as "sign this build" and then fails on
      # `security import` with a blank payload. Only forward non-empty values so
      # unsigned DMGs still publish; adding real secrets enables signing with no
      # other workflow change.
      - name: Configure optional Apple signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for key in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID
          do
            val="${!key}"
            if [ -n "$val" ]; then
              {
                echo "${key}<<EOF"
                printf '%s\n' "$val"
                echo "EOF"
              } >> "$GITHUB_ENV"
            fi
          done

      - name: Build and upload disk image
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ needs.release.outputs.version }}
          releaseDraft: true
          # macOS auto-update stays off until release signing is configured, so
          # this job must not overwrite the Windows updater manifest.
          includeUpdaterJson: false
          args: --target universal-apple-darwin

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [release, release-macos]
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ needs.release.outputs.version }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
