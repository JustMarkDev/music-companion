name: opencode

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: opencode-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name == 'pull_request' && 'review' || 'chat' }}
  cancel-in-progress: true

jobs:
  opencode:
    # PRs: skip drafts, fork PRs and Dependabot PRs (no secret access). Comments: only trusted users can trigger /oc.
    if: >-
      (github.event_name == 'pull_request' &&
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]') ||
      (github.event_name != 'pull_request' &&
        (startsWith(github.event.comment.body, '/oc') || startsWith(github.event.comment.body, '/opencode')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
      actions: read
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0
          persist-credentials: false

      # opencode v2 has no `github` command and the official action only installs v1, so run the
      # CLI directly. The installer resolves the latest v2 and adds it to $GITHUB_PATH.
      - name: Install opencode v2
        run: curl -fsSL https://opencode.ai/v2/install | bash

      # The job is read-only by design (contents: read, no pushes): PRs run the review agent and /oc
      # comments run the built-in read-only plan agent, so they suggest fixes and never make them. --auto answers permission prompts, since CI has nobody to ask. Unlike the
      # v1 action, `opencode run` does not post anything, so the last text event becomes the comment (a non-zero exit, an error event or no reply fails the job after posting).
      - name: Run opencode
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          AGENT: ${{ github.event_name == 'pull_request' && 'review' || 'plan' }}
          PROMPT: >-
            ${{ github.event_name == 'pull_request' && 'Review this pull request. Follow .github/opencode-review.md exactly: verify and resolve earlier findings, find new problems, post them as one inline GitHub review, then reply with the summary.' || format('Repository {0}, issue or PR #{1}. Answer this comment; your final message is posted as the reply. You are read-only: suggest changes, never make them. Comment: {2}{3}', github.repository, github.event.issue.number || github.event.pull_request.number, github.event.comment.body, github.event.comment.path && format(' [Inline comment on {0} line {1}; diff hunk: {2}]', github.event.comment.path, github.event.comment.line, github.event.comment.diff_hunk) || '') }}
        run: |
          set -o pipefail
          out="$RUNNER_TEMP/opencode.jsonl"
          status=0
          opencode run --standalone --auto --format json --agent "$AGENT" -m 'opencode-go/muse-spark-1.3-contributor#xhigh' "$PROMPT" | tee "$out" || status=$?
          jq -rs '[.[] | select(.type == "text")] | last | .part.text // empty' "$out" > "$RUNNER_TEMP/reply.md"
          if [ -s "$RUNNER_TEMP/reply.md" ]; then gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/reply.md"; fi
          [ "$status" = 0 ] && [ -s "$RUNNER_TEMP/reply.md" ] && jq -es 'any(.[]; .type == "error") | not' "$out" > /dev/null || { echo "opencode failed or produced no reply"; exit 1; }

      # Keep one clean summary: drop the action's run-link footer, collapse older summaries.
      - name: Tidy summaries
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          summaries=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/comments" |
            jq '[.[][] | select(.user.type == "Bot" and (.body | startswith("## Review ·")))]')
          jq -c '.[-1] // empty | {id, body: (.body | sub("\\n+\\[github run\\]\\([^)]*\\)\\s*$"; ""))}' <<< "$summaries" |
            while read -r c; do
              jq -r .body <<< "$c" | gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$(jq -r .id <<< "$c")" -F body=@-
            done
          jq -r '.[:-1][].node_id' <<< "$summaries" |
            while read -r id; do
              gh api graphql -f id="$id" -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { minimizedComment { isMinimized } } }'
            done

      # Non-required check mirroring the verdict; skipped if this run produced no summary.
      - name: Verdict check
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=${{ github.event.pull_request.head.sha }}
          last=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/comments" |
            jq -r '[.[][] | select(.user.type == "Bot" and (.body | startswith("## Review · ")))] | .[-1].body // empty')
          [[ "$last" == "## Review · ${sha:0:7}"* ]] || exit 0
          verdict=$(sed -n 3p <<< "$last")
          case "$verdict" in *🚫*) c=failure ;; *⚠️*) c=neutral ;; *) c=success ;; esac
          gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" -f name='opencode review' -f head_sha="$sha" \
            -f status=completed -f conclusion="$c" -f 'output[title]=opencode review' -f "output[summary]=$verdict"
