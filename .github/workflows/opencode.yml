name: opencode

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: opencode-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  opencode:
    # PRs: skip drafts and fork PRs (no secret access). Comments: only trusted users can trigger /oc.
    if: >-
      (github.event_name == 'pull_request' &&
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' &&
        (startsWith(github.event.comment.body, '/oc') || startsWith(github.event.comment.body, '/opencode')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/muse-spark-1.3-contributor
          use_github_token: true
          prompt: >-
            ${{ github.event_name == 'pull_request' && 'Review this pull request. Read the full diff and the surrounding code it touches. Report only real problems: bugs, logic errors, regressions, security issues, data loss, race conditions, missing error handling at trust boundaries. Each finding must cite file:line, explain the concrete failure scenario, and suggest a fix. No style nits, no praise, no summary of the diff. If nothing is wrong, say so in one line.' || '' }}
