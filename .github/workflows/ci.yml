name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# Pushes to main are never cancelled: the release job runs at the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changed-areas:
    name: Detect changed areas
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      native: ${{ steps.changes.outputs.native }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect affected areas
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # No usable base (first push, force push): treat every file as changed.
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BASE_SHA" HEAD)"
          else
            files="$(git ls-files)"
          fi

          frontend=false
          native=false

          if grep -Eq '^(src/|index\.html$|package\.json$|bun\.lock$|tsconfig\.json$|vite\.config\.ts$|\.gitattributes$|\.gitignore$|\.github/workflows/)' <<<"$files"; then
            frontend=true
          fi

          if grep -Eq '^(src-tauri/|package\.json$|bun\.lock$|\.gitattributes$|\.gitignore$|\.gitmodules$|\.github/workflows/)' <<<"$files"; then
            native=true
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "native=$native" >> "$GITHUB_OUTPUT"

  frontend-checks:
    name: Frontend checks
    needs: detect-changed-areas
    if: needs.detect-changed-areas.outputs.frontend == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check frontend
        run: bun run check:js

      - name: Test frontend
        run: bun run test:js

      - name: Build frontend
        run: bun run build

      - name: Audit frontend dependencies
        run: bun audit

  native-checks:
    name: Rust and Tauri checks (${{ matrix.name }})
    needs: detect-changed-areas
    if: needs.detect-changed-areas.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            targets: x86_64-pc-windows-msvc
          - name: macOS
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.targets }}
          components: rustfmt, clippy

      - name: Install cargo-audit and cargo-nextest
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-audit,cargo-nextest

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # build.rs compiles the vendored MediaRemote adapter with CMake.
      - name: Verify CMake is available
        if: runner.os == 'macOS'
        run: cmake --version || brew install cmake

      - name: Check Rust formatting and lints
        run: bun run check:rust

      - name: Test Rust
        run: bun run test:rust

      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: cargo audit

  gate:
    name: CI
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - detect-changed-areas
      - frontend-checks
      - native-checks
    steps:
      - name: Verify required job states
        env:
          DETECT_RESULT: ${{ needs.detect-changed-areas.result }}
          FRONTEND_CHANGED: ${{ needs.detect-changed-areas.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend-checks.result }}
          NATIVE_CHANGED: ${{ needs.detect-changed-areas.outputs.native }}
          NATIVE_RESULT: ${{ needs.native-checks.result }}
        run: |
          test "$DETECT_RESULT" = success

          if [ "$FRONTEND_CHANGED" = true ]; then
            test "$FRONTEND_RESULT" = success
          else
            test "$FRONTEND_RESULT" = skipped
          fi

          if [ "$NATIVE_CHANGED" = true ]; then
            test "$NATIVE_RESULT" = success
          else
            test "$NATIVE_RESULT" = skipped
          fi

  release:
    name: Release
    needs: gate
    # always(): a skipped ancestor (frontend/native) would otherwise skip this job.
    if: always() && github.event_name == 'push' && needs.gate.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
